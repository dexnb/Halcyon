name: Android Build

on:
  push:
    tags:
      - 'build-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arm64:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Halcyon
        uses: actions/checkout@v4

      - name: Determine build type & version
        id: meta
        run: |
          TYPE="debug"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TYPE="release"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TYPE="${{ inputs.build_type }}"
          fi
          VERSION=$(grep -oP 'appVersionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "构建类型: $TYPE, 版本: $VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "cmake;3.22.1" \
            "ndk;28.2.13676358"
          if ! sdkmanager --channel=3 "platforms;android-37"; then
            echo "platforms;android-37 is unavailable from sdkmanager; using android-36 as a CI compatibility platform."
            sdkmanager "platforms;android-36"
            mkdir -p "$ANDROID_HOME/platforms/android-37"
            cp -a "$ANDROID_HOME/platforms/android-36/." "$ANDROID_HOME/platforms/android-37/"
            sed -i 's/AndroidVersion.ApiLevel=36/AndroidVersion.ApiLevel=37/' "$ANDROID_HOME/platforms/android-37/source.properties"
          fi
          sdkmanager --channel=3 "build-tools;37.0.0" || sdkmanager "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        if: ${{ steps.meta.outputs.type == 'debug' }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: ./gradlew --no-daemon :app:assembleDebug -PellaAbi=arm64-v8a --stacktrace

      - name: Decode release keystore
        if: ${{ steps.meta.outputs.type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          ls -l release.jks

      - name: Build release APK
        if: ${{ steps.meta.outputs.type == 'release' }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease -PellaAbi=arm64-v8a --stacktrace

      - name: List APK outputs
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print -exec ls -lh {} \;
          find app/build/outputs/renamed-apk -type f -name "*.APK" -print -exec ls -lh {} \; || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Halcyon-arm64-v8a-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*arm64-v8a*.apk
            app/build/outputs/apk/release/*arm64-v8a*.apk
            app/build/outputs/renamed-apk/debug/*arm64-v8a*.APK
            app/build/outputs/renamed-apk/release/*arm64-v8a*.APK
          if-no-files-found: error

      - name: Publish release APK
        if: ${{ steps.meta.outputs.type == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}-${{ github.run_number }}
          name: Halcyon arm64-v8a release (build ${{ github.run_number }})
          body: |
            自动构建的 arm64-v8a 正式签名 release APK（由上游同步或手动触发）。
          files: |
            app/build/outputs/apk/release/*arm64-v8a*.apk
            app/build/outputs/renamed-apk/release/*arm64-v8a*.APK
          draft: false
          prerelease: false
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-package release APKs
        if: ${{ steps.meta.outputs.type == 'release' }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p pkg-apks
          build_pkg() {
            local pkg="$1"
            local name="$2"
            echo ">>> 构建 $name ($pkg)"
            ./gradlew --no-daemon :app:assembleRelease -PellaAbi=arm64-v8a -PappId="$pkg" --stacktrace
            local apk
            apk=$(ls app/build/outputs/apk/release/*arm64-v8a*.apk | head -1)
            cp "$apk" "pkg-apks/Halcyon-${VERSION}-${name}-arm64-v8a-release.apk"
          }
          build_pkg "com.kugou.android" "KugouMusic"
          build_pkg "com.kugou.android.lite" "KugouMusicLite"
          build_pkg "com.tencent.qqmusic" "QQMusic"
          build_pkg "com.netease.cloudmusic" "NeteaseCloudMusic"
          ls -lh pkg-apks/

      - name: Generate multi-package release body
        if: ${{ steps.meta.outputs.type == 'release' }}
        run: |
          TAG="${{ steps.meta.outputs.version }}-${{ github.run_number }}-pkg"
          python3 - "$TAG" "$VERSION" <<'PYEOF'
          import sys
          tag = sys.argv[1]
          version = sys.argv[2]
          apps = [
              ("酷狗音乐", "com.kugou.android", "KugouMusic"),
              ("酷狗音乐概念版", "com.kugou.android.lite", "KugouMusicLite"),
              ("QQ音乐", "com.tencent.qqmusic", "QQMusic"),
              ("网易云音乐", "com.netease.cloudmusic", "NeteaseCloudMusic"),
          ]
          lines = ["## 不同包名版本（ColorOS 锁屏岛歌词白名单）", ""]
          lines.append("将 Halcyon 伪装成各大音乐 App 的包名，安装后 ColorOS 锁屏岛会将其识别为对应 App 并显示歌词。")
          lines.append("")
          lines.append("| 音乐软件 | 包名 | 下载 |")
          lines.append("|---|---|---|")
          for cname, pkg, label in apps:
              apkname = f"Halcyon-{version}-{label}-arm64-v8a-release.apk"
              url = f"https://github.com/dexnb/Halcyon/releases/download/{tag}/{apkname}"
              lines.append(f"| {cname} | `{pkg}` | [下载]({url}) |")
          lines.append("")
          lines.append("> 与原版 Halcyon 功能完全一致，仅修改了应用包名，用于 ColorOS 锁屏岛歌词白名单识别。")
          open("pkg-body.md", "w", encoding="utf-8").write("\n".join(lines))
          print("\n".join(lines))
          PYEOF

      - name: Publish multi-package release
        if: ${{ steps.meta.outputs.type == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}-${{ github.run_number }}-pkg
          name: Halcyon 多包名版本（ColorOS 锁屏岛歌词白名单）
          body_path: pkg-body.md
          files: |
            pkg-apks/*.apk
          draft: false
          prerelease: false
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
